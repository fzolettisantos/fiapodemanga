<!doctype html>
<html><head><meta charset="utf-8">
<!--
  Demonstração do App de Revenda (Supergasbras) montada com as telas reais do aplicativo.
  Telas recortadas em ./screens (sem moldura): coordenadas "nativas" de cada imagem são
  convertidas para a tela do celular (372×780) pelas funções A() e B().
-->
<style>
  html,body{margin:0;width:1600px;height:900px;overflow:hidden;background:#d63c00}
  #stage{position:relative;width:1600px;height:900px;overflow:hidden;
    background:radial-gradient(70% 80% at 30% 20%,#ff7a33 0%,transparent 70%),linear-gradient(150deg,#ff6a1f 0%,#e64a05 55%,#c93400 100%)}
  #waves{position:absolute;left:-200px;top:-150px;width:2000px;height:1200px}
  #dots{position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.13) 1px,transparent 1.4px);background-size:30px 30px}
  #rig{position:absolute;left:614px;top:60px;width:372px;height:780px;transform-origin:0 0}
  #phone{position:absolute;left:-14px;top:-14px;width:400px;height:808px;border-radius:58px;background:#16171a;
    box-shadow:0 0 0 2px #3a3c41 inset,0 50px 90px rgba(80,20,0,.45),0 18px 30px rgba(80,20,0,.3)}
  #phone::before{content:"";position:absolute;right:-3px;top:190px;width:4px;height:90px;border-radius:2px;background:#2a2b2f}
  #phone::after{content:"";position:absolute;left:-3px;top:160px;width:4px;height:60px;border-radius:2px;background:#2a2b2f;box-shadow:0 80px 0 #2a2b2f}
  #screen{position:absolute;left:0;top:0;width:372px;height:780px;border-radius:44px;overflow:hidden;background:#fff}
  #status{position:absolute;left:0;top:0;width:372px;height:40px;z-index:5;background:#fff;
    font:600 15px/40px "Helvetica Neue",Helvetica,Arial,sans-serif;color:#111}
  #status .time{position:absolute;left:34px;top:2px}
  #status svg{position:absolute;right:26px;top:14px}
  #island{position:absolute;left:136px;top:9px;width:100px;height:28px;border-radius:14px;background:#000;z-index:6}
  .scr{position:absolute;left:0;top:40px;width:372px;height:740px;overflow:hidden;opacity:0}
  .scr img{display:block;width:372px;height:auto;position:absolute;left:0;top:0}
  .shade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none}
  #modal{position:absolute;left:0;width:372px;height:auto}
  #touch{position:absolute;left:0;top:0;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;z-index:8;
    background:rgba(40,40,40,.26);box-shadow:0 0 0 2px rgba(255,255,255,.9),0 4px 10px rgba(0,0,0,.25)}
  .rip{position:absolute;width:70px;height:70px;margin:-35px 0 0 -35px;border-radius:50%;z-index:7;
    border:3px solid rgba(255,90,20,.9);opacity:0}
</style></head>
<body><div id="stage">
<svg id="waves" viewBox="0 0 2000 1200" aria-hidden="true">
  <path id="w1" d="M-100 760 C 300 560, 520 980, 900 760 S 1500 520, 2100 700 L 2100 1300 L -100 1300 Z" fill="#ff8a4d" opacity=".55"/>
  <path id="w2" d="M-100 220 C 260 60, 520 420, 880 260 S 1460 20, 2100 160 L 2100 -100 L -100 -100 Z" fill="#ff9a62" opacity=".4"/>
  <path id="w3" d="M-100 920 C 340 760, 600 1120, 1000 940 S 1600 760, 2100 900 L 2100 1300 L -100 1300 Z" fill="#ffb27f" opacity=".35"/>
</svg>
<div id="dots"></div>
<div id="rig">
  <div id="phone"></div>
  <div id="screen">
    <div id="status"><span class="time">9:41</span>
      <svg width="70" height="13" viewBox="0 0 70 13"><g fill="#111">
        <rect x="0" y="8" width="3" height="5" rx="1"/><rect x="5" y="6" width="3" height="7" rx="1"/><rect x="10" y="3" width="3" height="10" rx="1"/><rect x="15" y="0" width="3" height="13" rx="1"/>
        <path d="M30 4.5a10 10 0 0 1 13 0l-1.6 1.7a7.6 7.6 0 0 0-9.8 0zM33 7.7a5.6 5.6 0 0 1 7 0l-3.5 3.8z"/>
        <rect x="47" y="1" width="21" height="11" rx="3" fill="none" stroke="#111" stroke-width="1.3"/><rect x="49" y="3" width="17" height="7" rx="1.5"/></g></svg>
    </div>
    <div id="island"></div>
    <div class="scr" id="fin" style="background:#fff"><img src="screens/financeiro.png"><div class="shade"></div></div>
    <div class="scr" id="neg" style="background:#fff"><img src="screens/negociacao.png"><div class="shade"></div></div>
    <div class="scr" id="ped" style="background:#fff"><img src="screens/pedidos.png"><div class="shade"></div></div>
    <div class="scr" id="ava" style="background:#fbfbfb"><img src="screens/avariados.png"><div class="shade"></div></div>
    <div class="scr" id="his" style="background:#f0f0f0"><img src="screens/historico.png"><div class="shade"></div></div>
    <div class="scr" id="fil" style="background:#fff"><img src="screens/filtro-base.png"><img id="modal" src="screens/filtro-modal.png"><div class="shade"></div></div>
    <div class="scr" id="mes" style="background:#fff"><img src="screens/mes.png"><div class="shade"></div></div>
  </div>
  <div class="rip" id="r"></div>
  <div id="touch"></div>
</div>
</div>
<script>
const T = 28;
const ease = x => x < .5 ? 4*x*x*x : 1 - Math.pow(-2*x+2, 3)/2;
const lerp = (a,b,t) => a + (b-a)*t;
const clamp01 = x => Math.max(0, Math.min(1, x));
function track(keys, t){
  if (t <= keys[0][0]) return keys[0][1];
  for (let i=1;i<keys.length;i++){
    const [t1,v1]=keys[i-1],[t2,v2]=keys[i];
    if (t<=t2){ const k=ease((t-t1)/(t2-t1)); return Array.isArray(v1)? v1.map((x,j)=>lerp(x,v2[j],k)) : lerp(v1,v2,k); }
  }
  return keys[keys.length-1][1];
}
// coordenadas nativas -> tela do celular
const sA = 372/393, sB = 372/514;
const A = (x,y) => [(x-40)*sA, 40+(y-95)*sA];   // telas com barra inferior (financeiro, negociação, pedidos)
const B = (x,y) => [(x-12)*sB, 40+(y-82)*sB];   // telas de avariados
const P = (x,y) => [(x-12)*sB, 40+(y-82+107)*sB]; // histórico (página composta; y da tela rolada)

// transições entre telas
const trans = [
  ['fin','neg',4.6,'push'], ['neg','ped',9.6,'fade'], ['ped','ava',14.4,'fade'],
  ['ava','his',17.4,'push'], ['his','fil',22.2,'push'], ['fil','mes',25.3,'quick'], ['mes','fin',27.3,'fade'],
];
const DUR = {push:.6, fade:.5, quick:.22};
const ids = ['fin','neg','ped','ava','his','fil','mes'];

// toque (posições na tela do celular)
const touch = [
  [0,[186,560]],[1.0,[186,560]],[2.6,A(315,420)],[4.4,A(315,420)],
  [6.0,[250,560]],[8.2,[230,600]],[9.0,A(295,850)],[10.0,A(295,850)],
  [12.2,[200,560]],[13.6,A(375,850)],[15.2,A(375,850)],
  [16.4,B(377,628)],[17.6,B(377,628)],
  [18.6,[250,520]],[19.4,P(492,260)],[20.4,P(492,260)],[21.6,[300,180]],[22.4,[300,180]],
  [24.0,B(175,762)],[25.4,B(175,762)],[26.4,B(267,708)],[28,B(267,708)],
];
const taps = [[3.4,A(315,420)],[9.2,A(295,850)],[14.0,A(375,850)],[16.8,B(377,628)],[19.6,P(492,260)],[24.6,B(175,762)],[26.6,B(267,708)]];
const touchOpacity = [[0,0],[0.8,0],[1.2,1],[27.2,1],[27.6,0],[28,0]];
// câmera: [escala, foco x, foco y] em coordenadas da tela do celular
const C0 = [1,186,390];
const cam = [[0,C0],[5.6,C0],[6.6,[1.32,186,B(0,0)[1]+300]],[8.2,[1.32,186,330]],[8.9,C0],
  [10.6,C0],[11.4,[1.3,186,A(0,450)[1]]],[12.8,[1.3,186,A(0,450)[1]]],[13.5,C0],
  [18.6,C0],[19.8,[1.28,186,P(0,880)[1]-60]],[21.2,[1.28,186,P(0,880)[1]-60]],[21.9,C0],
  [23.6,C0],[24.3,[1.18,186,470]],[27.0,[1.18,186,470]],[27.8,C0],[28,C0]];
cam[2][1] = [1.32,186,A(0,480)[1]]; // detalhes da negociação

window.render = (t) => {
  // telas
  let cur = 'fin', active = null;
  for (const tr of trans){ if (t >= tr[2]) { cur = tr[1]; active = (t < tr[2]+DUR[tr[3]]) ? tr : null; } }
  for (const id of ids){
    const el = document.getElementById(id); let op = 0, x = 0, shade = 0;
    if (active){
      const [from,to,t0,type] = active; const k = ease(clamp01((t-t0)/DUR[type]));
      if (id === to){ op = type==='push' ? 1 : k; x = type==='push' ? (1-k)*372 : 0; }
      else if (id === from){ op = type==='fade' ? 1 : 1; x = type==='push' ? -k*110 : 0; shade = type==='push' ? k*.12 : 0; }
      el.style.zIndex = id === to ? 2 : 1;
    } else if (id === cur){ op = 1; el.style.zIndex = 1; }
    el.style.opacity = op; el.style.transform = `translateX(${x}px)`;
    el.querySelector('.shade').style.opacity = shade;
  }
  // folha de filtro sobe
  const my = track([[22.5,420],[23.2,0]], t);
  const m = document.getElementById('modal'); m.style.top = (446-82)*sB + my + 'px';
  // toque
  const [tx,ty] = track(touch, t); const tEl = document.getElementById('touch');
  let press = 1, rip = null;
  for (const [ct,pos] of taps){ const d = t-ct; if (d>-0.1 && d<0.18) press = 0.78; if (d>=0 && d<0.6) rip = [pos,d]; }
  tEl.style.left = tx+'px'; tEl.style.top = ty+'px'; tEl.style.opacity = track(touchOpacity,t);
  tEl.style.transform = `scale(${press})`;
  const r = document.getElementById('r');
  if (rip){ const [[rx,ry],d] = rip; const k = d/0.6; r.style.left=rx+'px'; r.style.top=ry+'px'; r.style.opacity=1-k; r.style.transform=`scale(${0.35+k*1.1})`; }
  else r.style.opacity = 0;
  // câmera + leve flutuação
  const [s,fx,fy] = track(cam, t);
  const float = Math.sin(t/T*Math.PI*4)*6;
  document.getElementById('rig').style.transform = `translate(${186-fx*s}px,${390-fy*s+float}px) scale(${s})`;
  // ondas do fundo (loop)
  const ph = t/T*Math.PI*2;
  document.getElementById('w1').setAttribute('transform', `translate(${Math.sin(ph)*40},${Math.cos(ph)*14})`);
  document.getElementById('w2').setAttribute('transform', `translate(${Math.cos(ph)*-50},${Math.sin(ph)*12})`);
  document.getElementById('w3').setAttribute('transform', `translate(${Math.sin(ph+1)*-30},${Math.cos(ph+1)*10})`);
};
window.T = T;
</script></body></html>
