<!doctype html>
<html><head><meta charset="utf-8">
<style>
  html,body{margin:0;width:1600px;height:900px;overflow:hidden;background:#11131d}
  #stage{position:relative;width:1600px;height:900px;overflow:hidden;
    background:
      radial-gradient(60% 70% at 70% 20%, rgba(46,84,230,.55) 0%, transparent 60%),
      radial-gradient(50% 60% at 15% 90%, rgba(204,255,123,.10) 0%, transparent 60%),
      linear-gradient(160deg,#151a33 0%,#0f1122 100%)}
  #dots{position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.10) 1px,transparent 1.3px);background-size:28px 28px}
  #win{position:absolute;left:232px;top:46px;width:1136px;border-radius:16px;overflow:hidden;background:#fff;
    box-shadow:0 40px 90px rgba(0,0,0,.5),0 0 0 1px rgba(255,255,255,.08)}
  #bar{height:34px;background:#f1f3f8;display:flex;align-items:center;gap:8px;padding:0 14px;border-bottom:1px solid #e3e6ee}
  #bar i{width:11px;height:11px;border-radius:50%;background:#d5d9e3;display:block}
  #bar b{margin-left:18px;height:16px;width:300px;border-radius:8px;background:#e3e6ee;display:block}
  #view{position:relative;width:1136px;height:760px;overflow:hidden;background:#fff}
  #cam{position:absolute;left:0;top:0;width:1184px;height:792px;transform-origin:0 0}
  .scr{position:absolute;left:0;top:0;width:1184px;height:792px;opacity:0}
  .scr img{display:block;width:1184px;height:792px;transform:scale(1.045);transform-origin:50% 50%}
  #e{background:#fff}
  #e img{position:absolute;left:87px;top:0;width:1010px;height:792px;transform:none}
  #hl{position:absolute;left:14px;top:142px;width:1156px;height:68px;background:rgba(37,99,235,.10);border-left:3px solid #2563eb;opacity:0}
  #glow{position:absolute;left:851px;top:84px;width:183px;height:49px;border-radius:8px;opacity:0;
    box-shadow:0 0 0 3px rgba(168,85,247,.9),0 0 34px 10px rgba(168,85,247,.55)}
  #cursor{position:absolute;left:0;top:0;width:28px;height:28px;will-change:transform;filter:drop-shadow(0 3px 4px rgba(0,0,0,.35))}
  .rip{position:absolute;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;border:3px solid #2563eb;opacity:0}
</style></head>
<body><div id="stage"><div id="dots"></div>
<div id="win"><div id="bar"><i></i><i></i><i></i><b></b></div>
<div id="view"><div id="cam">
  <div class="scr" id="a"><img src="../../../public/images/projetos/ged-ai/controle-de-documentos.webp"><div id="hl"></div></div>
  <div class="scr" id="b"><img src="../../../public/images/projetos/ged-ai/cadastro-em-etapas.webp"></div>
  <div class="scr" id="c"><img src="../../../public/images/projetos/ged-ai/gerenciamento.webp"></div>
  <div class="scr" id="d"><img src="../../../public/images/projetos/ged-ai/filtros-e-tour.webp"></div>
  <div class="scr" id="e"><img src="../../../public/images/projetos/ged-ai/historico-e-ia.webp"><div id="glow"></div></div>
  <div class="rip" id="r"></div>
  <svg id="cursor" viewBox="0 0 28 28"><path d="M4 2 L4 22 L9.5 17 L13.5 26 L17.5 24.2 L13.6 15.4 L21 15.4 Z" fill="#111" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg>
</div></div></div></div>
<script>
const T = 26;
const ease = x => x < .5 ? 4*x*x*x : 1 - Math.pow(-2*x+2, 3)/2;
const lerp = (a,b,t) => a + (b-a)*t;
// keyframes genéricos: [t, valor]
function track(keys, t){
  if (t <= keys[0][0]) return keys[0][1];
  for (let i=1;i<keys.length;i++){
    const [t1,v1]=keys[i-1],[t2,v2]=keys[i];
    if (t<=t2){ const k=ease((t-t1)/(t2-t1)); return Array.isArray(v1)? v1.map((x,j)=>lerp(x,v2[j],k)) : lerp(v1,v2,k); }
  }
  return keys[keys.length-1][1];
}
// opacidade das telas
const scenes = {
  a:[[0,1],[5.2,1],[5.8,0],[25.4,0],[26,1]],
  b:[[5.2,0],[5.8,1],[10.2,1],[10.8,0]],
  c:[[10.2,0],[10.8,1],[15.2,1],[15.8,0]],
  d:[[15.2,0],[15.8,1],[20.4,1],[21,0]],
  e:[[20.4,0],[21,1],[25.4,1],[26,0]],
};
// cursor (coordenadas da tela 1184x792)
const cursor = [[0,[300,600]],[0.6,[300,600]],[1.6,[420,178]],[2.4,[430,182]],[3.6,[915,673]],[5.2,[915,673]],
  [6.0,[900,300]],[7.0,[590,500]],[7.6,[595,505]],[8.8,[1092,716]],[10.4,[1092,716]],
  [11.2,[555,533]],[12.4,[560,536]],[13.2,[650,608]],[13.8,[650,608]],[14.6,[1118,742]],[15.6,[1118,742]],
  [16.2,[983,168]],[17.4,[985,170]],[18.4,[566,343]],[19.4,[570,346]],[20.0,[912,334]],[20.8,[912,334]],
  [21.6,[700,500]],[22.6,[943,111]],[24.6,[943,111]],[25.6,[300,600]],[26,[300,600]]];
const clicks = [[3.8,[915,673]],[7.2,[590,500]],[9.0,[1092,716]],[12.2,[555,533]],[14.8,[1118,742]],[17.0,[983,168]],[19.0,[566,343]],[20.3,[912,334]],[22.8,[943,111]]];
// câmera: [escala, foco x, foco y]
const cam = [[0,[1,592,396]],[3.2,[1.04,592,396]],[4.4,[1.38,915,520]],[5.4,[1.38,915,520]],[5.8,[1,592,396]],
  [8.2,[1.08,800,560]],[10.4,[1.08,800,560]],[10.8,[1,592,396]],[11.6,[1.18,840,420]],[14.2,[1.18,860,520]],[15.4,[1.18,860,520]],[15.8,[1,592,396]],
  [17.0,[1,592,396]],[18.2,[1.32,730,280]],[20.4,[1.32,730,280]],[20.8,[1,592,396]],[22.0,[1.06,600,330]],[25.4,[1.06,600,330]],[26,[1,592,396]]];
const VW=1184, VH=792, SC=1136/1184;
window.render = (t) => {
  for (const [id,k] of Object.entries(scenes)){
    const el=document.getElementById(id); el.style.opacity = track(k,t);
    if (id==='c'){ el.style.transform = `translateX(${track([[10.2,60],[10.9,0]],t)}px)`; }
    if (id==='e'){ const s=track([[20.4,.94],[21.1,1]],t); el.style.transform=`scale(${s})`; el.style.transformOrigin='50% 40%'; }
  }
  document.getElementById('hl').style.opacity = track([[1.4,0],[1.8,1],[2.6,1],[3.0,0]],t);
  document.getElementById('glow').style.opacity = t<22.8?0: (0.55+0.45*Math.sin((t-22.8)*5))*track([[22.8,0],[23.1,1],[24.8,1],[25.3,0]],t);
  const [cx,cy]=track(cursor,t); const c=document.getElementById('cursor');
  // clique: leve "aperto" do cursor
  let press=1; let rip=null;
  for (const [ct,pos] of clicks){ const d=t-ct; if (d>-0.08 && d<0.15) press=0.85; if (d>=0 && d<0.6) rip=[pos,d]; }
  c.style.transform=`translate(${cx-4}px,${cy-2}px) scale(${press})`;
  const r=document.getElementById('r');
  if (rip){ const [[rx,ry],d]=rip; const k=d/0.6; r.style.left=rx+'px'; r.style.top=ry+'px'; r.style.opacity=1-k; r.style.transform=`scale(${0.3+k*1.1})`; } else r.style.opacity=0;
  const [s,fx,fy]=track(cam,t);
  // mantém o foco no centro da janela, sem mostrar bordas vazias
  let tx = VW/2 - fx*s, ty = VH/2 - fy*s;
  tx = Math.min(0, Math.max(VW - VW*s, tx)); ty = Math.min(0, Math.max(VH - VH*s, ty));
  document.getElementById('cam').style.transform=`scale(${SC}) translate(${tx}px,${ty}px) scale(${s})`;
};
window.T = T;
</script></body></html>
